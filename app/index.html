<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Notes</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="base.css">
<style>
  main{max-width:56rem}
  .layout{display:grid;grid-template-columns:16rem 1fr;gap:1rem;margin-top:.75rem}
  @media (max-width:40rem){.layout{grid-template-columns:1fr}}
  .side{display:grid;gap:.5rem;align-content:start}
  #search{width:100%}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:.25rem;max-height:60vh;overflow:auto}
  li button{width:100%;text-align:left;border-color:transparent;background:transparent;display:grid;gap:.1rem}
  li button[aria-current="true"]{background:var(--card);border-color:var(--line)}
  li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .d{font-size:.8rem;color:var(--muted)}
  textarea{width:100%;min-height:55vh;resize:vertical;line-height:1.6}
  .editor{display:grid;gap:.5rem;align-content:start}
  .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem}
  .empty{color:var(--muted);font-size:.9rem;padding:.5rem}
</style>
</head>
<body>
<main>
  <h1>Quick Notes</h1>
  <p class="sub">Notes save as you type and stay in this browser. The first line is the title.</p>
  <div class="layout">
    <div class="side">
      <div class="row"><button id="new" class="primary">New note</button></div>
      <label class="sr-only" for="search">Search notes</label>
      <input id="search" type="search" placeholder="Search notes">
      <ul id="list" aria-label="Notes"></ul>
    </div>
    <div class="editor">
      <label class="sr-only" for="text">Note</label>
      <textarea id="text" placeholder="Start typing…"></textarea>
      <div class="meta"><span id="status"></span><button id="delete">Delete note</button></div>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
